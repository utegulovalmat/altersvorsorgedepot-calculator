services:
  - type: web
    name: avd-calculator-api
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: BANK_SIGNUP_BASE_URL
        sync: false

  - type: web
    name: avd-calculator-mcp
    env: docker
    dockerfilePath: ./Dockerfile.mcp
    autoDeploy: true
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PORT
        value: 8001
      - key: BANK_SIGNUP_BASE_URL
        sync: false
